<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Enter payment and delivery details to complete your Rainy Days order."
    />
    <title>Rainy Days | Payment</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">RAINYDAYS</a>

        <nav aria-label="Main navigation">
          <ul class="nav-list">
            <li><a class="nav-link" href="index.html">Home</a></li>
            <li><a class="nav-link" href="products.html">Products</a></li>
            <li><a class="nav-link" href="about.html">About</a></li>
            <li><a class="nav-link" href="contact.html">Contact</a></li>
            <li><a class="nav-link" href="cart.html">Cart</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container">
      <section class="page-card">
        <h1>Payment details</h1>
        <p>Please fill in your information to complete the order.</p>

        <form class="form" action="confirmation.html" method="get">
          <div>
            <label for="full-name">Full name</label>
            <input id="full-name" name="full-name" type="text" autocomplete="name" required />
          </div>

          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div>
            <label for="address">Address</label>
            <input id="address" name="address" type="text" autocomplete="street-address" required />
          </div>

          <div>
            <label for="card-number">Card number</label>
            <input
              id="card-number"
              name="card-number"
              type="text"
              inputmode="numeric"
              autocomplete="cc-number"
              placeholder="1234 5678 9012 3456"
              required
            />
          </div>

          <div>
            <label for="expiry">Expiry date</label>
            <input
              id="expiry"
              name="expiry"
              type="text"
              autocomplete="cc-exp"
              placeholder="MM/YY"
              required
            />
          </div>

          <div>
            <label for="cvc">CVC</label>
            <input
              id="cvc"
              name="cvc"
              type="text"
              inputmode="numeric"
              autocomplete="cc-csc"
              placeholder="123"
              required
            />
          </div>

          <button class="btn" type="submit">Place order</button>
          <a class="btn btn-secondary" href="confirmation.html">Back to cart</a>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2026 Rainy Days</p>
        <p>Checkout</p>
      </div>
    </footer>
  </body>
</html>
