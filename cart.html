<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View the items in your shopping cart at Rainy Days."
    />
    <title>Your Cart | Rainy Days</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">RAINYDAYS</a>

        <nav aria-label="Primary">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="products.html">Products</a>
          <a class="nav-link" href="about.html">About</a>
          <a class="nav-link" href="contact.html">Contact</a>
          <a class="nav-link active" href="cart.html">Cart</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h1>Your Cart</h1>

      <section class="cart-items" aria-label="Items in your cart">
        <article class="cart-item">
          <div class="cart-item-image">
            <img
              src="Jackets/RainyDays_Jacket1.jpg"
              alt="Rainy Days Classic Jacket in black"
            />
          </div>

          <div class="cart-item-info">
            <h2 class="cart-item-title">Rainy Days Classic Jacket</h2>
            <p class="cart-item-meta">Price: $99.00 </p>
            <p class="cart-item-meta">Quantity: 1</p>
          </div>
        </article>
      </section>

      <section class="cart-summary" aria-label="Cart summary">
        <p>Total: <strong>$99.00 </strong></p>
        <a class="btn" href="checkout.html">Proceed to checkout</a>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2025 Rainy Days</p>
      <p>
        Contact:
        <a href="mailto:info@rainydays.com">info@rainydays.com</a>
      </p>
      <p>
        Follow us:
        <a href="#">Instagram</a> | <a href="#">Facebook</a> | <a href="#">X</a>
      </p>
    </footer>
  </body>
</html>
