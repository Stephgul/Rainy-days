<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact Rainy Days support. Send us a message with questions about products, delivery, or returns."
    />
    <title>Rainy Days | Contact</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">RAINYDAYS</a>

        <nav aria-label="Main navigation">
          <ul class="nav-list">
            <li><a class="nav-link" href="index.html">Home</a></li>
            <li><a class="nav-link" href="products.html">Products</a></li>
            <li><a class="nav-link" href="about.html">About</a></li>
            <li><a class="nav-link" href="contact.html" aria-current="page">Contact</a></li>
            <li><a class="nav-link" href="cart.html">Cart</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container">
      <section class="page-card">
        <h1>Contact</h1>
        <p>Send us a message and we will get back to you.</p>

        <form class="form" action="index.html" method="get">
          <div>
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>

          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <button class="btn" type="submit">Send message</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2026 Rainy Days</p>
        <p>We are here to help</p>
      </div>
    </footer>
  </body>
</html>
